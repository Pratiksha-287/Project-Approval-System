<!doctype html>
<html>
<body>
  <h2>HOD Dashboard</h2>
  <ul>
    {% for p in projects %}
      <li>{{ p.title }} — {{ p.student.username }} — <a href="{% url 'hod_review' p.id %}">Review</a></li>
    {% empty %}<li>No projects waiting for HOD.</li>{% endfor %}
    <p><a href="{% url 'logout' %}">Logout</a></p>
  </ul>
</body>
</html>
